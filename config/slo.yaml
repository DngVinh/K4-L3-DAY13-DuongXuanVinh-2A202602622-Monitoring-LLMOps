service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    A request is good only when response_sent exists and latency is at most 3000 ms.
    The CP0 successful requests were about 155-249 ms; 3000 ms leaves room for
    normal load but treats the 2500 ms retrieval practice delay plus overhead
    as at risk. For 28 days, 99.5% gives a 0.5% bad-request budget:
    floor(total_requests * 0.005), e.g. 50 bad requests per 10000 attempts.
    Time-equivalent budget is 0.005 * 28 * 24 * 60 = 201.6 minutes, but the
    operational SLI is request-based, so use request counts for burn calculations.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
